<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#0b0b14" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#pwa-grad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Stylized Cloud with Play button & Star -->
  <g filter="url(#glow)">
    <!-- Play Badge -->
    <circle cx="256" cy="256" r="140" fill="url(#pwa-grad)" />
    <!-- Play Triangle -->
    <path d="M224 196L324 256L224 316Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  </g>
  <!-- Sparkle stars -->
  <path d="M370 140L376 156L392 162L376 168L370 184L364 168L348 162L364 156Z" fill="#fbbf24" />
  <path d="M140 330L144 342L156 346L144 350L140 362L136 350L124 346L136 342Z" fill="#38bdf8" />
</svg>
